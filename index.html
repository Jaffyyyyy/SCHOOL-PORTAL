<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MAM-ON School Portal — Dashboard</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Chart.js and PapaParse from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>MAM-ON Elementary — School Portal Dashboard</h1>
    <p class="meta" id="meta-info">Loading data...</p>
  </header>

  <main class="container">
    <section class="kpis">
      <div class="kpi" id="kpi-total">
        <div class="kpi-value">—</div>
        <div class="kpi-label">Total Learners</div>
      </div>
      <div class="kpi" id="kpi-mps">
        <div class="kpi-value">—</div>
        <div class="kpi-label">Overall MPS</div>
      </div>
      <div class="kpi" id="kpi-atrisk">
        <div class="kpi-value">—</div>
        <div class="kpi-label">At-Risk Learners</div>
      </div>
      <div class="kpi" id="kpi-submission">
        <div class="kpi-value">—</div>
        <div class="kpi-label">Submission Rate</div>
      </div>
    </section>

    <section class="filters">
      <label>Grade
        <select id="filter-grade"><option value="All">All</option></select>
      </label>
      <label>Subject
        <select id="filter-subject"><option value="All">All</option></select>
      </label>
      <label>Teacher
        <select id="filter-teacher"><option value="All">All</option></select>
      </label>
    </section>

    <section class="charts">
      <div class="chart-card">
        <h3>MPS by Grade</h3>
        <canvas id="chart-mps-grade"></canvas>
      </div>
      <div class="chart-card">
        <h3>At-Risk by Grade</h3>
        <canvas id="chart-atrisk-grade"></canvas>
      </div>
    </section>

    <section class="tables">
      <div class="table-card">
        <h3>Teacher Submission Status</h3>
        <table id="table-teachers"><thead></thead><tbody></tbody></table>
      </div>
      <div class="table-card">
        <h3>Top Competencies Needing Improvement</h3>
        <table id="table-competencies"><thead></thead><tbody></tbody></table>
      </div>
    </section>

    <section class="recent">
      <h3>Recent Assessment Submissions</h3>
      <table id="table-recent"><thead></thead><tbody></tbody></table>
    </section>

  </main>

  <script src="assets/js/dashboard.js"></script>
</body>
</html>
